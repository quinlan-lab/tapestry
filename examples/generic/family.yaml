schema_version: 1
mode: pedigree

project:
  id: example_family
  outdir: results/example_family

pedigree:
  ped: family.ped

reference:
  name: GRCh38
  fasta: data/hg38.analysisSet.fa
  fasta_index: data/hg38.analysisSet.fa.fai

upstream:
  manifest: pacbio-wdl.tapestry.json
  allow_unaudited_release: false

samples:
  include: [CHILD]

inheritance:
  method: gtg
  map:
    min_qual: 20
    min_depth: 10
    min_run_markers: 10
  concordance:
    min_qual: 20
    min_depth: 5

methylation:
  modes: [model]
  min_coverage: 10
  mismatch_window_bp: 50

outputs:
  bigwig: true
