name: CI

on:
  pull_request:
  push:
    branches: [main, dev, workflow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-pipeline.txt
            requirements-ci.txt

      - name: Install check dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-pipeline.txt
          .venv/bin/python -m pip install --requirement requirements-ci.txt

      - name: Type check maintained workflow modules
        run: .venv/bin/pyright

      - name: Check workflow shell syntax
        run: bash -n tests/run_nextflow_e2e.sh tests/run_nextflow_trio_smoke.sh

  workflow:
    name: Workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: "24.04.2"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Check trio annotation region boundaries
        env:
          NXF_OFFLINE: "true"
          NXF_ANSI_LOG: "false"
        run: |
          cd "$RUNNER_TEMP"
          nextflow run "$GITHUB_WORKSPACE/tests/trio_annotation_target.nf"

      - name: Build pinned runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: |
            tapestry:ci
            ghcr.io/quinlan-lab/tapestry:dev
          platforms: linux/amd64
          cache-from: type=gha,scope=tapestry-ci
          cache-to: type=gha,mode=max,scope=tapestry-ci

      - name: Run unit and regression tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/work/src:/work/src/util \
            --env MPLCONFIGDIR=/tmp/matplotlib \
            tapestry:ci python -m unittest discover -v -s tests -p 'test_*.py'

      - name: Run pedigree workflow twice
        env:
          NXF_ANSI_LOG: "false"
          TAPESTRY_CONTAINER: tapestry:ci
        run: tests/run_nextflow_e2e.sh

      - name: Prepare trio reference and run container smoke test
        env:
          NXF_ANSI_LOG: "false"
          TAPESTRY_TRIO_CONTAINER: ghcr.io/quinlan-lab/tapestry:dev
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/work" --workdir /work \
            tapestry:ci bash ./trio_dev_data_get_ref.sh trio_dev_data
          tests/run_nextflow_trio_smoke.sh

      - name: Upload workflow diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 5
          path: |
            .test-work/e2e.*/nextflow.*.log
            .test-work/e2e.*/report.*.html
            .test-work/e2e.*/trace.*.tsv
            .test-work/e2e.*/timeline.*.html
            .test-work/e2e.*/dag.*.html
            .test-work/e2e.*/fixture/results/**/results-manifest.json
            .test-work/e2e.*/fixture/results/**/*.qc.json
            .test-work/trio-smoke.*/.nextflow.log*
            .test-work/trio-smoke.*/.nextflow-reports/**
            .test-work/trio-smoke.*/work/**/.command.*
            .test-work/trio-smoke.*/results/**/*.qc.json

  publish:
    name: Publish image
    needs: [static-checks, workflow]
    if: >-
      github.repository == 'quinlan-lab/tapestry' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish shared runtime
        id: runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/quinlan-lab/tapestry:dev
            ghcr.io/quinlan-lab/tapestry:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tapestry-ci

      - name: Record published digest
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          printf 'Default runtime: `ghcr.io/quinlan-lab/tapestry@%s`\n\n' "$RUNTIME_DIGEST" >> "$GITHUB_STEP_SUMMARY"
